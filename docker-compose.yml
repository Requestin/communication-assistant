services:
  db:
    image: postgres:16-alpine
    container_name: commassist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - commassist

  web:
    build: .
    container_name: commassist-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3010"
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commassist

  worker:
    build: .
    container_name: commassist-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_BASE_URL: http://llm:8088/v1
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commassist

  llm:
    image: nvidia/cuda:12.4.1-runtime-ubuntu22.04
    container_name: commassist-llm
    restart: unless-stopped
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LD_LIBRARY_PATH: /opt/llama/bin:/usr/local/cuda/lib64
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - /root/local_llm/llama.cpp/build/bin:/opt/llama/bin:ro
      - ${LLM_GGUF_PATH}:/models/model.gguf:ro
    command:
      - /opt/llama/bin/llama-server
      - --model
      - /models/model.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8088"
      - --ctx-size
      - "8192"
      - -ngl
      - "99"
      - --alias
      - qwen36
      - --reasoning
      - "off"
    networks:
      - commassist

volumes:
  pgdata:

networks:
  commassist:
    name: commassist
