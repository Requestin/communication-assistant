services:
  db:
    image: postgres:16-alpine
    container_name: commassist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - commassist

  web:
    build: .
    container_name: commassist-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3010"
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commassist

  worker:
    build: .
    container_name: commassist-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commassist

volumes:
  pgdata:

networks:
  commassist:
    name: commassist
