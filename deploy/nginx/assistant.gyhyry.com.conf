# Живая копия: /etc/nginx/sites-available/assistant.gyhyry.com.conf
# Симлинк: /etc/nginx/sites-enabled/assistant.gyhyry.com.conf
# Не копировать в mapvideo.gyhyry.com.conf. После правок: nginx -t && nginx -s reload.

server {
    server_name assistant.gyhyry.com;

    access_log /var/log/nginx/assistant_gyhyry_com_access.log;
    error_log  /var/log/nginx/assistant_gyhyry_com_error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
        # Next dev отдаёт Location на listen-хост. Без этих строк браузер
        # уезжает на https://localhost:3010 и получает ERR_SSL_PROTOCOL_ERROR.
        proxy_redirect http://127.0.0.1:3010/ https://assistant.gyhyry.com/;
        proxy_redirect http://localhost:3010/ https://assistant.gyhyry.com/;
        proxy_redirect https://127.0.0.1:3010/ https://assistant.gyhyry.com/;
        proxy_redirect https://localhost:3010/ https://assistant.gyhyry.com/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/assistant.gyhyry.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/assistant.gyhyry.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = assistant.gyhyry.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name assistant.gyhyry.com;
    return 404; # managed by Certbot
}